name: custom-dangerous-patterns
version: "0.2.0"
description: >-
  Add custom dangerous command patterns to Hermes's built-in approval
  system. Users define regex patterns in ~/.hermes/custom-dangerous-patterns.yaml;
  the plugin injects them into DANGEROUS_PATTERNS so they get the same
  once/session/always/deny approval flow.
