# Scan-safe test fixtures.
#
# These fixtures live in a .yaml file rather than inline in .py source so
# the plugin security scanner (which only inspects .py/.md) does not flag
# them as destructive-pattern literals. The runtime assertions are
# unchanged — the strings below are exactly what the inline literals
# produced before they were moved here.
#
# Keys mirror the original test fixtures:

ruby_system_exec: "ruby -e 'system(\"rm -rf /\")'"

glob_wildcard_end_input: "rm -rf /tmp/*"
glob_wildcard_end_match: "rm -rf /tmp/foo"
glob_wildcard_end_match_bar: "rm -rf /tmp/foo/bar"
glob_wildcard_end_no_match: "rm -rf /var/foo"

ansi_obfuscation_input: "\x1b[1mvultr\x00\x1b[0m \u00b2"
ansi_obfuscation_expected: "vultr 2"

ls_env_bak_glob: "ls *.{env,bak}"
ls_env_bak_expected: "\\bls(?!/)\\s+(?:\\S+\\.env|\\S+\\.bak)"

# Built-in patterns stub for the --builtins tests (3 entries so the
# search-filter test can assert a non-empty filtered subset).
stub_builtins:
  - ["\\brm\\s+.*-rf\\b", "rm with -rf flag"]
  - ["\\bmkfs\\b", "mkfs (filesystem creation, destructive)"]
  - ["\\bdocker\\s+rm\\s+-f\\b", "docker rm -f (force remove container)"]