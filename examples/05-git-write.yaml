  - description: '[GIT_WRITE] Deny git maintenance'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+maintenance\b.*'
