  - description: '[GIT_WRITE] Deny git worktree'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+worktree\b.*'
