# Uses deny_patterns with regex patterns for high-precision command matching.
# This format is needed because glob-based matching cannot express the
# complex negative lookahead and option-parsing required to prevent
# arguments like `-c key=value` or `-C /path` from bypassing subcommand rules.
deny_patterns:
  # NOTE: FLAG token now matches BOTH "--flag=value" and "--flag value" / "-C path" forms,
  # so global options placed before the subcommand (e.g. `git -c foo=bar update-index`,
  # `git -C /path checkout`) can no longer be used to slip a write subcommand past these rules.
  # FLAG := (?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?)

  # --- WORKING DIRECTORY & INDEX MODIFICATIONS ---
  - description: '[GIT_WRITE] Deny git add'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+add\b.*'
  - description: '[GIT_WRITE] Deny git rm'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+rm\b.*'
  - description: '[GIT_WRITE] Deny git mv'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+mv\b.*'
  - description: '[GIT_WRITE] Deny git clean'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+clean\b.*'
  - description: '[GIT_WRITE] Deny git restore'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+restore\b.*'
  - description: '[GIT_WRITE] Deny git checkout'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+checkout\b.*'
  - description: '[GIT_WRITE] Deny git switch'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+switch\b.*'
  - description: '[GIT_WRITE] Deny git sparse-checkout'
    enabled: true
    group: GIT_WRITE
    pattern: '\bgit\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?(?:\s+[^\s-][^\s]*)?))*\s+sparse-checkout\b.*'

  # --- COMMITTING & BRANCHING ---
