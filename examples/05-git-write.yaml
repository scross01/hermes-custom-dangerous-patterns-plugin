  # --- GITHUB CLI (GH) DESTRUCTIVE OPERATIONS ---
  - description: '[GH_WRITE] Deny gh API modifications (POST, PUT, PATCH, DELETE)'
    enabled: true
    group: GH_WRITE
    pattern: '\bgh\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?))*\s+api\b.*-(?:X|-method)\s+(?:POST|PUT|PATCH|DELETE)\b.*'
  - description: '[GH_WRITE] Deny gh api implicit-POST via field flags'
    enabled: true
    group: GH_WRITE
    pattern: '\bgh\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?))*\s+api\b.*\s+(?:-f|--field|--raw-field|--input)\b.*'
  - description: '[GH_WRITE] Deny gh repo modifications'
    enabled: true
    group: GH_WRITE
    pattern: '\bgh\b(?:\s+(?:--?[a-zA-Z0-9_-]+(?:=[^\s]+)?))*\s+repo\s+(?:create|delete|edit|fork|rename|archive)\b.*'
  - description: '[GH_WRITE] Deny gh issue modifications'
