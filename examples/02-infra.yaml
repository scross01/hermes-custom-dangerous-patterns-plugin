patterns:
  # --- Infrastructure as Code ---
  - description: opentofu apply/destroy (infrastructure changes)
    group: infra
    glob: opentofu {apply,destroy,import,state} **

  # --- Configuration Management ---
  - description: ansible-playbook (remote execution)
    group: infra
    glob: ansible-playbook **

  - description: ansible ad-hoc shell commands
    group: infra
    glob: ansible ** -m shell **

  - description: ansible ad-hoc command module
    group: infra
    glob: ansible ** -a **

  # --- Container Runtimes (beyond built-in docker lifecycle) ---
  # Written as regexes, not globs: `docker run ** --privileged**` compiles to
  # `\s+.*\s+--privileged.*`, which cannot match `docker run --privileged
  # ubuntu` -- the most common spelling of the command it exists to catch --
  # because `**` requires a token on both sides. Anything that can be the
  # FIRST argument must be a `pattern:`, never a glob.
  - description: docker run with privileged flag
    group: infra
    pattern: '\bdocker(?!/)\s+run(?:\s+\S+)*\s+--privileged\b'

  - description: docker run mounting root filesystem
    group: infra
    pattern: '\bdocker(?!/)\s+run(?:\s+\S+)*\s+-v\s+/:'

  - description: docker run mounting /etc
    group: infra
    pattern: '\bdocker(?!/)\s+run(?:\s+\S+)*\s+-v\s+/etc:'

  # One rule per subcommand, deliberately: the combined
  # `podman {rm,rmi,stop,kill} **` form shared the bigram `stop delete` with
  # Hermes's docker-compose lifecycle rule and so drew a BUILT-IN OVERLAP
  # warning at startup, even though no podman command ever defers to a built-in.
  # Split, the warning is correct by absence rather than by disclaimer.
  - description: podman rm
    group: infra
    glob: podman rm **

  - description: podman rmi
    group: infra
    glob: podman rmi **

  - description: podman stop
    group: infra
    glob: podman stop **

  - description: podman kill
    group: infra
    glob: podman kill **

  # Same `**` trap as the docker rules above: `podman run ** --privileged**`
  # never matches `podman run --privileged alpine`.
  - description: podman run with privileged flag
    group: infra
    pattern: '\bpodman(?!/)\s+run(?:\s+\S+)*\s+--privileged\b'

  # --- VM Lifecycle ---
  - description: colima stop
    group: infra
    glob: colima stop

  - description: colima delete
    group: infra
    glob: colima delete

  - description: colima destroy
    group: infra
    glob: colima destroy

  - description: limactl stop
    group: infra
    glob: limactl stop

  - description: limactl delete
    group: infra
    glob: limactl delete

  # --- TLS/Certificate Management ---
  - description: certbot delete/revoke/unregister
    group: infra
    glob: certbot {delete,revoke,unregister} **

  - description: certbot force renewal
    group: infra
    glob: certbot renew --force-renewal
